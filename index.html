<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HZR Device Center</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: #0d0d0d;
            border: 1px solid #202020;
            border-radius: 22px;
            padding: 30px 24px;
            text-align: center;
        }

        .logo {
            font-size: 45px;
            font-weight: bold;
            letter-spacing: 7px;
            color: #00ffae;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 12px;
            margin-bottom: 30px;
        }

        .notice {
            background: #111;
            border: 1px solid #242424;
            border-radius: 14px;
            padding: 15px;
            color: #aaa;
            font-size: 13px;
            line-height: 1.7;
            margin-bottom: 22px;
        }

        .status {
            color: #00ffae;
            font-size: 14px;
            min-height: 22px;
        }

        .loader {
            width: 32px;
            height: 32px;
            margin: 20px auto;
            border: 3px solid #222;
            border-top-color: #00ffae;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .done {
            color: #00ffae;
        }

        .error {
            color: #ff5555;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">HZR</div>

    <div class="subtitle">
        DEVICE INFORMATION
    </div>

    <div class="notice">
        By continuing, you agree that the device information
        available to this browser may be sent to the configured
        recipient. Location is requested separately and only
        with your permission.
    </div>

    <div class="loader" id="loader"></div>

    <div class="status" id="status">
        Preparing information...
    </div>

</div>

<script>

    const status = document.getElementById("status");
    const loader = document.getElementById("loader");

    function setStatus(message, type = "") {
        status.textContent = message;
        status.className = "status " + type;
    }


    async function getBatteryData() {

        if (!navigator.getBattery) {
            return {
                supported: false
            };
        }

        try {

            const battery = await navigator.getBattery();

            return {
                supported: true,
                level: Math.round(battery.level * 100),
                charging: battery.charging
            };

        } catch (error) {

            return {
                supported: false
            };
        }
    }


    function getBrowserData() {

        return {
            userAgent: navigator.userAgent || null,
            platform: navigator.platform || null,

            language: navigator.language || null,

            cpuCores:
                navigator.hardwareConcurrency || null,

            ramGB:
                navigator.deviceMemory || null,

            screen: {
                width: window.screen.width,
                height: window.screen.height,
                pixelRatio: window.devicePixelRatio || 1
            },

            timezone:
                Intl.DateTimeFormat().resolvedOptions().timeZone || null
        };
    }


    function requestLocation() {

        return new Promise((resolve) => {

            if (!navigator.geolocation) {

                resolve({
                    permission: "unsupported"
                });

                return;
            }

            navigator.geolocation.getCurrentPosition(

                function(position) {

                    resolve({
                        permission: "granted",
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy
                    });

                },

                function(error) {

                    resolve({
                        permission:
                            error.code === 1
                                ? "denied"
                                : "unavailable"
                    });

                },

                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        });
    }


    async function collectAndSend() {

        try {

            setStatus("Preparing information...");

            const battery = await getBatteryData();

            const browser = getBrowserData();

            /*
             * Location is requested explicitly by the browser.
             * If the user denies it, no coordinates are sent.
             */
            setStatus("Requesting location permission...");

            const location = await requestLocation();

            const payload = {

                project: "HZR",

                entryTime:
                    new Date().toISOString(),

                browser: browser,

                battery: battery,

                location: location

            };


            setStatus("Sending information...");


            const response = await fetch("/api/device-info", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(payload)

            });


            if (!response.ok) {
                throw new Error("Server rejected request");
            }


            loader.style.display = "none";

            setStatus(
                "Information sent successfully.",
                "done"
            );


        } catch (error) {

            loader.style.display = "none";

            setStatus(
                "Unable to send information.",
                "error"
            );

            console.error(error);
        }
    }


    /*
     * Automatically starts after page load.
     */
    window.addEventListener(
        "load",
        collectAndSend
    );

</script>

</body>
</html>
